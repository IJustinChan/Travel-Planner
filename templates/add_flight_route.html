<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Flight</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">✈️ Travel Planner</div>
            <ul class="nav-menu">
                <li><a href="{{ url_for('home') }}">Add Trip</a></li>
                <li><a href="{{ url_for('view_trips') }}">View Trips</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1>{{ trip['trip_name'] }}</h1>
            <p>{{ trip['start_date'] }} to {{ trip['end_date'] }}</p>
            <p>Adding a Flight</p>
        </div>
    </header>

    <main class="container">
        <div class="display-container">
            <h1>Add Flight</h1>
            <form class="trip-form" method="POST" action="{{ url_for('add_flight_route', trip_id=trip_id) }}">

                <div class="form-row">
                    <div class="form-group">
                        <label for="airline">Airline:</label>
                        <input type="text" id="airline" name="airline" required>
                    </div>

                    <div class="form-group">
                        <label for="flight_number">Flight Number:</label>
                        <input type="text" id="flight_number" name="flight_number" required>
                    </div>

                </div>
               
                <div class="form-row">
                    <div class="form-group">
                        <label for="departure_date">Departure Date:</label>
                        <input type="date" id="departure_date" name="departure_date" required>
                    </div>
    
                    <div class="form-group">
                        <label for="departure_time">Departure Time:</label>
                        <input type="time" id="departure_time" name="departure_time" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="arrival_date">Arrival Date:</label>
                        <input type="date" id="arrival_date" name="arrival_date" required>
                    </div>

                    <div class="form-group">
                        <label for="arrival_time">Arrival Time:</label>
                        <input type="time" id="arrival_time" name="arrival_time" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cost">Cost ($):</label>
                        <input type="number" id="cost" name="cost" step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="description">Description:</label>
                        <textarea id="description" name="description"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Flight</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </div>

            </form>
        </div>
        
    </main>

    <main class="container">
        <div class="form-actions">
            <a class="btn btn-secondary" href="{{ url_for('plan_trip', trip_id=trip_id) }}">Back to Trip Plan</a>
        </div>
    </main>

    <footer class="footer"></footer>

</body>
</html>
